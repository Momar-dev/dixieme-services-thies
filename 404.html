<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | Dixième Services - Thiès</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ED2939'/%3E%3Cpath d='M35 45c-3 0-5 2-5 5s2 5 5 5h5l10 15c2 3 6 3 8 0l20-20c2-2 2-5 0-7s-5-2-7 0L55 55 45 45H35z' fill='white'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --primary: #ED2939;
            --primary-dark: #c42232;
            --secondary: #1e293b;
            --light-bg: #f8fafc;
            --text-muted: #64748b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
            max-width: 520px;
            width: 100%;
            padding: 48px 36px;
            text-align: center;
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fee2e2;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 9999px;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(237, 41, 57, 0.35);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(237, 41, 57, 0.45);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--secondary);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .support-info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .support-info a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-badge"><i class="fa-solid fa-triangle-exclamation"></i> Erreur 404</span>
        <div class="error-code">404</div>
        <h1>Page introuvable</h1>
        <p>La page que vous recherchez n'existe pas ou a été déplacée. Retrouvez tous les professionnels et services du Quartier Dixième dès l'accueil.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Retour à l'accueil
            </a>
            <a href="tel:+221772133398" class="btn btn-secondary">
                <i class="fa-solid fa-phone"></i> Contacter Abdou Khadre (+221 77 213 33 98)
            </a>
        </div>
        <div class="support-info">
            Dixième Services • Le Quartier Dixième à Thiès
        </div>
    </div>
</body>
</html>
